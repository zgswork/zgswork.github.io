            letter-spacing: -0.5px;

        .header h1 span {
            color: #6c8cff;
        }

        .header h1::before {
            content: "";
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #6c8cff;
            margin-right: 10px;
            vertical-align: middle;
            box-shadow: 0 0 10px #6c8cff88;
        }

            position: relative;
            flex: 1;
            min-width: 220px;
            max-width: 420px;
        }

        .search-wrapper input {

            padding: 0.8rem 1rem 0.8rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.08);
            color: #e8edf7;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-wrapper input::placeholder {
            color: #8896b3;
        }

        .search-wrapper input:focus {
            border-color: #6c8cff;
            box-shadow: 0 0 0 4px rgba(108, 140, 255, 0.18);
            background: rgba(255, 255, 255, 0.12);
        }

        .search-wrapper .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #8896b3;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .stats {
            font-size: 0.95rem;
            color: #a0acc9;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stats strong {
            color: #e8edf7;
            font-weight: 600;
        }

        .stats .tag-count {
            font-size: 0.75rem;
            color: #a0acc9;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.15rem 0.7rem;
            border-radius: 999px;
            margin-left: 0.4rem;
        }

        /* ===== 网格 ===== */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        /* ===== 卡片 ===== */
        .file-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 1rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease, box-shadow 0.25s ease,
                border-color 0.25s ease, background 0.25s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            min-height: 52px;
        }

        .file-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(108, 140, 255, 0.18);
            border-color: rgba(108, 140, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
        }

        .file-card a {
            text-decoration: none;
            color: #e8edf7;
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .file-card a .filename {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .file-card a .badge {
            flex-shrink: 0;
            font-size: 0.55rem;
            font-weight: 600;
            color: #a0acc9;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.15rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 1rem;
            color: #8896b3;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .empty-state .emoji {
            font-size: 3.2rem;
            display: block;
            margin-bottom: 1rem;
        }

        /* ===== 显隐动画 ===== */
        .file-card {
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .file-card.hidden {
            display: none;
        }

        .file-card.visible {
            display: flex;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            left: 0;
            width: 100%;
            height: 100%;
            background: #0f1724;
            z-index: 9999;
            display: none;

            width: 20px;
            height: 20px;
            stroke: currentColor;

            color: #a0acc9;

            overflow: hidden;
            text-overflow: ellipsis;

        (function () {
            'use strict';
            if (typeof FILE_NAMES === 'undefined') {
                console.error('请确保 FILE_NAMES 已正确定义。');
                return;
            }

            const grid = document.getElementById('fileGrid');
            const searchInput = document.getElementById('searchInput');
            const totalCountEl = document.getElementById('totalCount');
            const visibleCountEl = document.getElementById('visibleCount');
            const overlay = document.getElementById('overlay');
            const backBtn = document.getElementById('backBtn');
            const contentFrame = document.getElementById('contentFrame');
            const overlayTitle = document.getElementById('overlayTitle');

            function getDisplayName(filename) {
                const baseName = filename.split('/').pop();
                const base = baseName.replace(/\.[^.]+$/, '');
                const parts = base.split(/[-_]/);
                return parts[0] && parts[0].trim() ? parts[0].trim() : base;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function render(files) {
                if (!files || files.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <span class="emoji">📭</span>
                            没有找到匹配的 HTML 文件
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const f of files) {
                    const display = getDisplayName(f);
                    html += `
                        <div class="file-card visible" data-filename="${escapeHtml(f)}">
                            <a href="#" title="${escapeHtml(f)}">
                                <span class="filename">${escapeHtml(display)}</span>
                            </a>
                        </div>
                    `;
                }
                grid.innerHTML = html;
            }

            function updateStats(total, visible) {
                totalCountEl.textContent = total;
                visibleCountEl.textContent =
                    visible === total ? '' : `(已搜索 ${visible} 个文件)`;
            }

            function filterFiles(query) {
                const q = query.trim().toLowerCase();
                const filtered = q
                    ? FILE_NAMES.filter(f =>
                        getDisplayName(f).toLowerCase().includes(q) ||
                        f.toLowerCase().includes(q)
                    )
                    : FILE_NAMES.slice();

                render(filtered);
                updateStats(FILE_NAMES.length, filtered.length);
            }

            function openFile(filename) {
                overlay.classList.add('active');
                overlayTitle.textContent = filename;
                contentFrame.src = encodeURI(filename);
            }

            function closeOverlay() {
                overlay.classList.remove('active');
                contentFrame.src = 'about:blank';
                overlayTitle.textContent = '正在加载…';
            }

            grid.addEventListener('click', e => {
                const card = e.target.closest('.file-card');
                if (card) {
                    e.preventDefault();
                    openFile(card.dataset.filename);
                }
            });

            backBtn.addEventListener('click', e => {
                e.preventDefault();
                closeOverlay();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && overlay.classList.contains('active')) {
                    closeOverlay();
                }
            });

            searchInput.addEventListener('input', () => filterFiles(searchInput.value));
            searchInput.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    filterFiles('');
                    searchInput.blur();
                }
            });

            render(FILE_NAMES);
            updateStats(FILE_NAMES.length, FILE_NAMES.length);
        })();
