<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首页概览</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 页面样式 */
        body {
            margin: 0;
            background: linear-gradient(135deg, #0c1220, #1a2332);
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-y: auto;
            height: 100vh;
        }

        .page-welcome {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-welcome h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #0ea5e9, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 15px;
        }

        .page-welcome .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 700px;
            margin: 0 auto 40px;
            text-align: center;
            line-height: 1.6;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }

        .tool-card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(94, 234, 212, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(2, 132, 199, 0.3);
            border-color: #38bdf8;
        }

        .tool-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #0ea5e9, #06b6d4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin-bottom: 20px;
        }

        .tool-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        .tool-desc {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 4px 10px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            font-size: 0.75rem;
            color: #38bdf8;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(94, 234, 212, 0.2);
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="page-welcome" id="app">
        <!-- 所有文本内容由 JS 数据驱动渲染 -->
        <h1 id="pageTitle"></h1>
        <p class="subtitle" id="pageSubtitle"></p>

        <div class="stats" id="statsContainer"></div>

        <div>
            <h2 class="section-title" id="sectionTitle"></h2>
            <div class="tools-grid" id="toolsContainer"></div>
        </div>
    </div>
    <script src="/js/welcome_data.js"></script>
    <script>
        
        // ============================================================
        // 🖌️ 渲染引擎 —— 将数据填充到页面 DOM
        // ============================================================
        function renderPage() {
            // 1. 渲染 h1 主标题
            document.getElementById('pageTitle').textContent = PAGE_DATA.title;

            // 2. 渲染副标题
            document.getElementById('pageSubtitle').textContent = PAGE_DATA.subtitle;

            // 3. 渲染统计卡片
            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = PAGE_DATA.stats.map(stat =>
                `<div class="stat-card">
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>`
            ).join('');

            // 4. 渲染 h2 章节标题
            document.getElementById('sectionTitle').textContent = PAGE_DATA.sectionTitle;

            // 5. 渲染工具卡片
            const toolsContainer = document.getElementById('toolsContainer');
            toolsContainer.innerHTML = PAGE_DATA.tools.map(tool =>
                `<div class="tool-card" data-page="${tool.page}">
                    <div class="tool-icon"><i class="${tool.icon}"></i></div>
                    <div class="tool-title">${tool.title}</div>
                    <div class="tool-desc">${tool.desc}</div>
                    <div class="tool-tags">
                        ${tool.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                </div>`
            ).join('');

            // 6. 重新绑定卡片点击事件（因为 DOM 被重新生成）
            document.querySelectorAll('.tool-card').forEach(card => {
                card.addEventListener('click', function() {
                    const page = this.dataset.page;
                    if (page && window.parent.switchPage) {
                        window.parent.switchPage(page);
                    }
                });
            });
        }

        // ============================================================
        // 🚀 页面加载完成后自动渲染
        // ============================================================
        document.addEventListener('DOMContentLoaded', renderPage);
    </script>
</body>

</html>
