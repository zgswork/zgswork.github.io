<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填充矩形工具，由 笙 制作</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1a2b;
            --panel: #1E293B;
            --panel2: #162032;
            --border: #2d4060;
            --border2: #3a5070;
            --green: #10B981;
            --yellow: #F59E0B;
            --cyan: #38BDF8;
            --red: #f87171;
            --text: #c8d8e8;
            --text2: #6b8299;
            --mono: 'Fira Code', 'Roboto Mono', 'Courier New', monospace;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 16px;
            overflow: hidden;
        }

        /* ── 布局 ───────────────────────── */
        #app {
            display: flex;
            height: 100vh;
        }

        /* ── 左侧控制台 ─────────────────── */
        #sidebar {
            width: 310px;
            min-width: 270px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border);
            background: var(--panel2);
            flex-shrink: 0;
        }

        #sidebar-header h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--green);
            letter-spacing: 0.04em;
        }

        #sidebar-header .sub {
            font-size: 16px;
            color: var(--text2);
            margin-top: 3px;
        }

        #sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--border2) transparent;
        }

        .section {
            border-bottom: 1px solid var(--border);
            padding: 10px 14px 12px;
        }

        .section-title {
            font-size: 16px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        /* 表单元素 */
        label {
            display: block;
            font-size: 16px;
            color: var(--text2);
            margin-bottom: 3px;
        }

        select,
        input[type="number"],
        input[type="text"] {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border2);
            color: #fff;
            font-family: var(--mono);
            font-size: 16px;
            padding: 4px 2px;
            outline: none;
            transition: border-color 0.1s;
        }

        select:focus,
        input:focus {
            border-bottom-color: var(--green);
        }

        select option {
            background: #1E293B;
        }

        .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .row3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .field {
            margin-bottom: 12px;
        }

        /* 单选模式 */
        .mode-group {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px 4px;
            background: transparent;
            border: 1px solid var(--border2);
            color: var(--text2);
            font-family: var(--mono);
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
        }

        .mode-btn.active {
            border-color: var(--green);
            color: var(--green);
            background: rgba(16, 185, 129, 0.08);
        }

        /* ── 按钮行 ──────────────────────── */
        .button-row {
            display: flex;
            gap: 8px;
            padding: 0 14px;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .button-row #btn-generate {
            flex: 3;
            padding: 9px 8px;
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            font-family: var(--mono);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 0;
            min-width: 0;
        }

        .button-row #btn-generate:hover {
            background: rgba(16, 185, 129, 0.12);
        }

        .button-row #btn-generate:active {
            background: rgba(16, 185, 129, 0.22);
        }

        .button-row #btn-generate:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .button-row .exp-btn {
            flex: 1;
            padding: 9px 4px;
            background: transparent;
            border: 1px solid var(--border2);
            color: #fff;
            font-family: var(--mono);
            font-size: 16px;
            cursor: pointer;
            transition: 0.1s;
            text-align: center;
            border-radius: 0;
            min-width: 0;
        }

        .button-row .exp-btn:hover {
            border-color: var(--yellow);
            color: #fff;
        }

        .button-row .exp-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* 错误提示 */
        #error-msg {
            margin: 6px 14px 0;
            font-size: 16px;
            color: var(--red);
            min-height: 16px;
            line-height: 1.4;
            flex-shrink: 0;
        }

        /* ── 右侧工作区 ──────────────────── */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        #canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
        }

        #canvas-wrap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 网格背景 via SVG pattern */
        #grid-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* 统计面板 */
        #stats-panel {
            position: absolute;
            top: 12px;
            right: 14px;
            z-index: 10;
            background: rgba(14, 22, 38, 0.88);
            border: 1px solid var(--border2);
            padding: 10px 14px;
            min-width: 190px;
            backdrop-filter: blur(2px);
        }

        .stats-title {
            font-size: 16px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 3px;
            font-size: 16px;
        }

        .stat-key {
            color: var(--text2);
        }

        .stat-val {
            color: var(--green);
            font-weight: 700;
            text-align: right;
        }

        .stat-val.cyan {
            color: var(--cyan);
        }

        .stat-val.yellow {
            color: var(--yellow);
        }

        #loading {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 26, 43, 0.7);
            z-index: 20;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--green);
            letter-spacing: 0.1em;
        }

        #loading.show {
            display: flex;
        }

        #empty-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 1;
            gap: 8px;
        }

        #empty-hint .em-icon {
            font-size: 42px;
            opacity: 0.12;
        }

        #empty-hint .em-text {
            font-size: 16px;
            color: #e2cdcd;
            opacity: 0.5;
        }

        @keyframes dashIn {
            from {
                stroke-dashoffset: 1000;
            }

            to {
                stroke-dashoffset: 0;
            }
        }

        .shape-outline {
            animation: dashIn 0.4s ease-out forwards;
        }

        .rect-anim {
            animation: dashIn 0.3s ease-out forwards;
        }

        #statusbar {
            height: 24px;
            background: var(--panel2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 20px;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }

        .sb-item span {
            color: #fff;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* ── 响应式微调 ─────────────────── */
        @media (max-width: 700px) {
            #sidebar {
                width: 240px;
                min-width: 180px;
            }
            .button-row {
                flex-wrap: wrap;
                gap: 5px;
            }
            .button-row #btn-generate {
                flex: 1 1 100%;
            }
            .button-row .exp-btn {
                flex: 1 1 40%;
            }
            .row2 {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .row3 {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .mode-group {
                flex-wrap: wrap;
            }
            .mode-btn {
                flex: 1 1 45%;
                font-size: 14px;
                padding: 5px 2px;
            }
            #stats-panel {
                min-width: 140px;
                padding: 6px 10px;
                font-size: 14px;
            }
            #stats-panel .stat-row {
                font-size: 14px;
            }
            #statusbar {
                font-size: 14px;
                padding: 0 8px;
                gap: 10px;
                flex-wrap: wrap;
                height: auto;
                min-height: 24px;
            }
            .sb-item {
                font-size: 13px;
            }
            .sb-item:last-child {
                margin-left: auto !important;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="sidebar">
            <div id="sidebar-header">
                <h1>▶ 填充矩形工具</h1>
            </div>
            <div id="sidebar-scroll">
                <div class="section">
                    <div class="section-title">形状类型</div>
                    <div class="field">
                        <select id="shape-type">
                            <option value="circle">圆</option>
                            <option value="trapezoid">梯形</option>
                            <option value="triangle">三角形</option>
                            <option value="ellipse">椭圆</option>
                            <option value="sector">扇形</option>
                            <option value="segment">弓形</option>
                            <option value="annulus">圆环</option>
                            <option value="sector-annulus">扇环</option>
                            <option value="regular-polygon">正多边形</option>
                        </select>
                    </div>
                </div>
                <div class="section" id="shape-params"></div>
                <div class="section">
                    <div class="section-title">矩形尺寸 (mm)</div>
                    <div class="row2">
                        <div class="field">
                            <label>宽 w1</label>
                            <input type="number" id="w1" value="320" min="1">
                        </div>
                        <div class="field">
                            <label>高 h1</label>
                            <input type="number" id="h1" value="160" min="1">
                        </div>
                    </div>
                    <div class="row2">
                        <div class="field">
                            <label>宽 w2 (可选)</label>
                            <input type="number" id="w2" placeholder="—" min="1">
                        </div>
                        <div class="field">
                            <label>高 h2 (可选)</label>
                            <input type="number" id="h2" placeholder="—" min="1">
                        </div>
                    </div>
                    <div class="field" id="allowance-container" style="display:none;">
                        <label>允许留空 (mm 可选)</label>
                        <input type="number" id="allowance" value="0" min="0" step="any">
                    </div>
                </div>
                <div class="section">
                    <div class="section-title">填充模式</div>
                    <div class="mode-group">
                        <button class="mode-btn active" data-mode="contains" id="mode-contains">形状包围矩形</button>
                        <button class="mode-btn" data-mode="surround" id="mode-surround">矩形包围形状</button>
                    </div>
                </div>
            </div>

            <!-- 错误信息 + 按钮行（生成 + 导出） -->
            <div id="error-msg"></div>
            <div class="button-row">
                <button id="btn-generate">▶ 生成填充方案</button>
                <button class="exp-btn" id="exp-jpg" disabled>JPG</button>
                <button class="exp-btn" id="exp-pdf" disabled>PDF</button>
            </div>

            <!-- 留一点点底部间距 -->
            <div style="height:6px; flex-shrink:0;"></div>
        </div>

        <div id="workspace">
            <div id="canvas-wrap">
                <svg id="main-svg" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a2d45" stroke-width="0.5" />
                        </pattern>
                        <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                            <rect width="100" height="100" fill="url(#smallGrid)" />
                            <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3550" stroke-width="1" />
                        </pattern>
                    </defs>
                    <g id="crosshair" opacity="0.25">
                        <line id="ch-v" y1="0" y2="10000" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="4 4" />
                        <line id="ch-h" x1="0" x2="10000" stroke="#38BDF8" stroke-width="0.5" stroke-dasharray="4 4" />
                    </g>
                    <g id="draw-layer" transform="translate(0,0)"></g>
                </svg>
                <div id="empty-hint">
                    <div class="em-icon">⬡</div>
                    <div class="em-text">设置参数后点击「生成填充方案」</div>
                </div>
                <div id="stats-panel" style="display:none">
                    <div class="stats-title">统计信息</div>
                    <div id="stats-content"></div>
                </div>
                <div id="loading"><span id="loading-text">COMPUTING...</span></div>
            </div>
            <div id="statusbar">
                <div class="sb-item">形状: <span id="sb-shape">—</span></div>
                <div class="sb-item">模式: <span id="sb-mode">—</span></div>
                <div class="sb-item">矩形: <span id="sb-count">—</span></div>
                <div class="sb-item" style="margin-left:auto; color: #f50808;">by 笙 版权所有，不得仿冒；合作与反馈QQ群(891047894)</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/dxf-writer@1.3.0/dist/dxf-writer.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script>
        // ============================================================
        //  工具函数
        // ============================================================
        function d2r(deg) { return deg * Math.PI / 180; }

        function pointInConvexPolygon(px, py, verts) {
            const n = verts.length;
            let side = 0;
            for (let i = 0; i < n; i++) {
                const [x1, y1] = verts[i];
                const [x2, y2] = verts[(i + 1) % n];
                const cross = (x2 - x1) * (py - y1) - (y2 - y1) * (px - x1);
                if (Math.abs(cross) < 1e-10) continue;
                const s = cross > 0 ? 1 : -1;
                if (side === 0) side = s;
                else if (side !== s) return false;
            }
            return true;
        }

        function triangleVertices(a, b, c) {
            if (a <= 0 || b <= 0 || c <= 0) return null;
            if (a + b <= c || a + c <= b || b + c <= a) return null;
            const cosB = (c * c + a * a - b * b) / (2 * c * a);
            if (cosB < -1 || cosB > 1) return null;
            const sinB = Math.sqrt(Math.max(0, 1 - cosB * cosB));
            const Bx = -a / 2,
                By = 0;
            const Cx = a / 2,
                Cy = 0;
            const Ax = Bx + c * cosB;
            const Ay = By - c * sinB;
            const gx = (Ax + Bx + Cx) / 3;
            const gy = (Ay + By + Cy) / 3;
            return [
                [Ax - gx, Ay - gy],
                [Bx - gx, By - gy],
                [Cx - gx, Cy - gy]
            ];
        }

        function regularPolygonVertices(n, R) {
            return Array.from({ length: n }, (_, k) => [
                R * Math.sin((2 * Math.PI * k) / n),
                -R * Math.cos((2 * Math.PI * k) / n),
            ]);
        }

        function trapezoidVertices(a, b, h, la, ra) {
            const laR = d2r(la),
                raR = d2r(ra);
            const bl = [-b / 2, h / 2];
            const br = [b / 2, h / 2];
            const tlx = -b / 2 + h / Math.tan(laR);
            const trx = b / 2 - h / Math.tan(raR);
            const tl = [tlx, -h / 2];
            const tr = [trx, -h / 2];
            const cx = (bl[0] + br[0] + tl[0] + tr[0]) / 4;
            const cy = (bl[1] + br[1] + tl[1] + tr[1]) / 4;
            return [
                [bl[0] - cx, bl[1] - cy],
                [br[0] - cx, br[1] - cy],
                [tr[0] - cx, tr[1] - cy],
                [tl[0] - cx, tl[1] - cy],
            ];
        }

        function isPointInShape(px, py, s) {
            switch (s.type) {
                case 'circle': {
                    const R = s.radius ?? 1;
                    return px * px + py * py <= R * R;
                }
                case 'ellipse': {
                    const a = s.semiMajor ?? 1,
                        b = s.semiMinor ?? 1;
                    return (px / a) ** 2 + (py / b) ** 2 <= 1;
                }
                case 'triangle': {
                    const verts = triangleVertices(s.sideA ?? 1, s.sideB ?? 1, s.sideC ?? 1);
                    if (!verts) return false;
                    return pointInConvexPolygon(px, py, verts);
                }
                case 'sector': {
                    const R = s.radius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    if (px * px + py * py > R * R) return false;
                    return Math.abs(Math.atan2(px, -py)) <= half;
                }
                case 'segment': {
                    const R = s.radius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const chordY = -R * Math.cos(half);
                    return px * px + py * py <= R * R && py <= chordY;
                }
                case 'annulus': {
                    const ro = s.outerRadius ?? 2,
                        ri = s.innerRadius ?? 1;
                    const r2 = px * px + py * py;
                    return r2 >= ri * ri && r2 <= ro * ro;
                }
                case 'sector-annulus': {
                    const ro = s.outerRadius ?? 2,
                        ri = s.innerRadius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const r2 = px * px + py * py;
                    if (r2 < ri * ri || r2 > ro * ro) return false;
                    return Math.abs(Math.atan2(px, -py)) <= half;
                }
                case 'regular-polygon': {
                    const n = Math.max(3, Math.round(s.sides ?? 6));
                    const sLen = s.sideLength ?? 1;
                    const R = sLen / (2 * Math.sin(Math.PI / n));
                    return pointInConvexPolygon(px, py, regularPolygonVertices(n, R));
                }
                case 'trapezoid': {
                    const a = s.topBase ?? 1,
                        b = s.bottomBase ?? 2;
                    const h = s.height ?? 1;
                    const la = s.leftAngle ?? 60,
                        ra = s.rightAngle ?? 60;
                    return pointInConvexPolygon(px, py, trapezoidVertices(a, b, h, la, ra));
                }
                default: return false;
            }
        }

        function getShapeBounds(s) {
            switch (s.type) {
                case 'circle': {
                    const R = s.radius ?? 1;
                    return { minX: -R, maxX: R, minY: -R, maxY: R };
                }
                case 'ellipse': {
                    const a = s.semiMajor ?? 1,
                        b = s.semiMinor ?? 1;
                    return { minX: -a, maxX: a, minY: -b, maxY: b };
                }
                case 'triangle': {
                    const verts = triangleVertices(s.sideA ?? 1, s.sideB ?? 1, s.sideC ?? 1);
                    if (!verts) return { minX: -1, maxX: 1, minY: -1, maxY: 1 };
                    return {
                        minX: Math.min(...verts.map(v => v[0])),
                        maxX: Math.max(...verts.map(v => v[0])),
                        minY: Math.min(...verts.map(v => v[1])),
                        maxY: Math.max(...verts.map(v => v[1])),
                    };
                }
                case 'sector': {
                    const R = s.radius ?? 1;
                    const edgeY = -R * Math.cos(d2r((s.centralAngle ?? 90) / 2));
                    return { minX: -R, maxX: R, minY: -R, maxY: Math.max(0, edgeY) };
                }
                case 'segment': {
                    const R = s.radius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const chordY = -R * Math.cos(half);
                    return { minX: -R * Math.sin(half), maxX: R * Math.sin(half), minY: -R, maxY: chordY };
                }
                case 'annulus': {
                    const ro = s.outerRadius ?? 2;
                    return { minX: -ro, maxX: ro, minY: -ro, maxY: ro };
                }
                case 'sector-annulus': {
                    const ro = s.outerRadius ?? 2;
                    const edgeY = -ro * Math.cos(d2r((s.centralAngle ?? 90) / 2));
                    return { minX: -ro, maxX: ro, minY: -ro, maxY: Math.max(0, edgeY) };
                }
                case 'regular-polygon': {
                    const n = Math.max(3, Math.round(s.sides ?? 6));
                    const R = (s.sideLength ?? 1) / (2 * Math.sin(Math.PI / n));
                    return { minX: -R, maxX: R, minY: -R, maxY: R };
                }
                case 'trapezoid': {
                    const verts = trapezoidVertices(
                        s.topBase ?? 1, s.bottomBase ?? 2, s.height ?? 1,
                        s.leftAngle ?? 60, s.rightAngle ?? 60,
                    );
                    return {
                        minX: Math.min(...verts.map(v => v[0])),
                        maxX: Math.max(...verts.map(v => v[0])),
                        minY: Math.min(...verts.map(v => v[1])),
                        maxY: Math.max(...verts.map(v => v[1])),
                    };
                }
                default: return { minX: -1, maxX: 1, minY: -1, maxY: 1 };
            }
        }

        function getShapeSymmetry(s) {
            switch (s.type) {
                case 'circle':
                case 'ellipse':
                case 'annulus':
                    return { xSym: true, ySym: true };
                case 'sector':
                case 'segment':
                case 'sector-annulus':
                    return { xSym: true, ySym: false };
                case 'triangle':
                    return { xSym: false, ySym: false };
                case 'regular-polygon': {
                    const n = Math.max(3, Math.round(s.sides ?? 6));
                    return { xSym: true, ySym: n % 2 === 0 };
                }
                case 'trapezoid': {
                    const la = s.leftAngle ?? 60,
                        ra = s.rightAngle ?? 60;
                    return { xSym: Math.abs(la - ra) < 0.5, ySym: false };
                }
                default: return { xSym: false, ySym: false };
            }
        }

        function getShapeCharacteristicRadius(s) {
            const b = getShapeBounds(s);
            return Math.max(Math.abs(b.minX), b.maxX, Math.abs(b.minY), b.maxY);
        }

        function distanceToShapeBoundary(px, py, s) {
            const r = Math.sqrt(px * px + py * py);
            switch (s.type) {
                case 'circle':
                    return Math.max(0, (s.radius ?? 1) - r);
                case 'annulus': {
                    const ri = s.innerRadius ?? 1,
                        ro = s.outerRadius ?? 2;
                    return Math.max(0, Math.min(r - ri, ro - r));
                }
                case 'sector': {
                    const R = s.radius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const cosH = Math.cos(half),
                        sinH = Math.sin(half);
                    const dArc = R - r;
                    const dRight = -(px * cosH + py * sinH);
                    const dLeft = px * cosH - py * sinH;
                    return Math.max(0, Math.min(dArc, dRight, dLeft));
                }
                case 'segment': {
                    const R = s.radius ?? 1;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const chordY = -R * Math.cos(half);
                    const dArc = R - r;
                    const dChord = chordY - py;
                    return Math.max(0, Math.min(dArc, dChord));
                }
                case 'sector-annulus': {
                    const ri = s.innerRadius ?? 1,
                        ro = s.outerRadius ?? 2;
                    const half = d2r((s.centralAngle ?? 90) / 2);
                    const cosH = Math.cos(half),
                        sinH = Math.sin(half);
                    const dInner = r - ri;
                    const dOuter = ro - r;
                    const dRight = -(px * cosH + py * sinH);
                    const dLeft = px * cosH - py * sinH;
                    return Math.max(0, Math.min(dInner, dOuter, dRight, dLeft));
                }
                default: {
                    const charR = getShapeCharacteristicRadius(s);
                    const dist = r;
                    const ndx = dist < 1e-9 ? 1 : px / dist;
                    const ndy = dist < 1e-9 ? 0 : py / dist;
                    let lo = 0,
                        hi = charR * 3;
                    for (let i = 0; i < 64; i++) {
                        const mid = (lo + hi) / 2;
                        if (isPointInShape(px + mid * ndx, py + mid * ndy, s)) lo = mid;
                        else hi = mid;
                    }
                    return lo;
                }
            }
        }

        function shouldKeepRect(rx, ry, w, h, shape, allowance) {
            if (allowance <= 0) return true;
            const N = 20;
            let insidePoints = [];
            for (let i = 0; i <= N; i++) {
                for (let j = 0; j <= N; j++) {
                    const px = rx + (i / N) * w;
                    const py = ry + (j / N) * h;
                    if (isPointInShape(px, py, shape)) {
                        insidePoints.push({ x: px, y: py });
                    }
                }
            }
            if (insidePoints.length === 0) return false;
            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            for (const p of insidePoints) {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.y < minY) minY = p.y;
                if (p.y > maxY) maxY = p.y;
            }
            const innerW = maxX - minX;
            const innerH = maxY - minY;
            const shortSide = Math.min(innerW, innerH);
            return shortSide >= allowance;
        }

        function pointInRect(px, py, r) {
            return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
        }

        function rectFullyInShape(rx, ry, w, h, s) {
            return isPointInShape(rx, ry, s) && isPointInShape(rx + w, ry, s) &&
                isPointInShape(rx, ry + h, s) && isPointInShape(rx + w, ry + h, s);
        }

        function rectOverlapsShape(rx, ry, w, h, s) {
            const N = 4;
            for (let i = 0; i <= N; i++)
                for (let j = 0; j <= N; j++)
                    if (isPointInShape(rx + (i / N) * w, ry + (j / N) * h, s)) return true;
            return false;
        }

        function getSearchOffsets(w, h, s) {
            const { xSym, ySym } = getShapeSymmetry(s);
            const N = 10;
            const oxList = xSym ? [0, w / 2] : Array.from({ length: N }, (_, i) => i * w / N);
            const oyList = ySym ? [0, h / 2] : Array.from({ length: N }, (_, i) => i * h / N);
            const result = [];
            for (const ox of oxList)
                for (const oy of oyList) result.push([ox, oy]);
            return result;
        }

        function scanBounds(s, w, h, ox, oy) {
            const b = getShapeBounds(s);
            const xMin = b.minX - w,
                yMin = b.minY - h;
            const xMax = b.maxX + w,
                yMax = b.maxY + h;
            const col0 = ox + Math.ceil((xMin - ox) / w) * w;
            const row0 = oy + Math.ceil((yMin - oy) / h) * h;
            return { col0, row0, xMax, yMax };
        }

        function solveShapeContainsRects(shape, w, h) {
            let best = [];
            for (const [ox, oy] of getSearchOffsets(w, h, shape)) {
                const { col0, row0, xMax, yMax } = scanBounds(shape, w, h, ox, oy);
                const rects = [];
                for (let rx = col0; rx < xMax; rx += w)
                    for (let ry = row0; ry < yMax; ry += h)
                        if (rectFullyInShape(rx, ry, w, h, shape)) rects.push({ x: rx, y: ry, w, h });
                if (rects.length > best.length) best = rects;
            }
            return best;
        }

        function solveRectsSurroundShape(shape, w, h, allowance = 0) {
            let best = null;
            for (const [ox, oy] of getSearchOffsets(w, h, shape)) {
                const { col0, row0, xMax, yMax } = scanBounds(shape, w, h, ox, oy);
                const rects = [];
                for (let rx = col0; rx < xMax; rx += w) {
                    for (let ry = row0; ry < yMax; ry += h) {
                        if (rectOverlapsShape(rx, ry, w, h, shape) &&
                            shouldKeepRect(rx, ry, w, h, shape, allowance)) {
                            rects.push({ x: rx, y: ry, w, h });
                        }
                    }
                }
                if (best === null || rects.length < best.length) best = rects;
            }
            return best ?? [];
        }

        function solveMixedShapeContains(shape, w1, h1, w2, h2) {
            const k = Math.round(w1 / w2),
                m = Math.round(h1 / h2);
            let best = { large: [], small: [] };
            for (const [ox, oy] of getSearchOffsets(w1, h1, shape)) {
                const { col0, row0, xMax, yMax } = scanBounds(shape, w1, h1, ox, oy);
                const large = [],
                    small = [];
                for (let rx = col0; rx < xMax; rx += w1) {
                    for (let ry = row0; ry < yMax; ry += h1) {
                        if (rectFullyInShape(rx, ry, w1, h1, shape)) {
                            large.push({ x: rx, y: ry, w: w1, h: h1 });
                        } else {
                            for (let p = 0; p < k; p++)
                                for (let q = 0; q < m; q++) {
                                    const sx = rx + p * w2,
                                        sy = ry + q * h2;
                                    if (rectFullyInShape(sx, sy, w2, h2, shape))
                                        small.push({ x: sx, y: sy, w: w2, h: h2 });
                                }
                        }
                    }
                }
                if (large.length + small.length > best.large.length + best.small.length)
                    best = { large, small };
            }
            return best;
        }

        function solveMixedRectsSurroundShape(shape, w1, h1, w2, h2, allowance = 0) {
            const k = Math.round(w1 / w2),
                m = Math.round(h1 / h2);
            let best = null;
            for (const [ox, oy] of getSearchOffsets(w1, h1, shape)) {
                const { col0, row0, xMax, yMax } = scanBounds(shape, w1, h1, ox, oy);
                const large = [],
                    small = [];
                for (let rx = col0; rx < xMax; rx += w1) {
                    for (let ry = row0; ry < yMax; ry += h1) {
                        if (!rectOverlapsShape(rx, ry, w1, h1, shape)) continue;
                        if (rectFullyInShape(rx, ry, w1, h1, shape) &&
                            shouldKeepRect(rx, ry, w1, h1, shape, allowance)) {
                            large.push({ x: rx, y: ry, w: w1, h: h1 });
                        } else {
                            for (let p = 0; p < k; p++) {
                                for (let q = 0; q < m; q++) {
                                    const sx = rx + p * w2,
                                        sy = ry + q * h2;
                                    if (rectOverlapsShape(sx, sy, w2, h2, shape) &&
                                        shouldKeepRect(sx, sy, w2, h2, shape, allowance)) {
                                        small.push({ x: sx, y: sy, w: w2, h: h2 });
                                    }
                                }
                            }
                        }
                    }
                }
                const total = large.length + small.length;
                if (best === null || total < best.large.length + best.small.length)
                    best = { large, small };
            }
            return best ?? { large: [], small: [] };
        }

        function computeCircumscribedRadius(rects) {
            if (!rects.length) return 0;
            let maxDist = 0;
            for (const r of rects)
                for (const [cx, cy] of [
                        [r.x, r.y],
                        [r.x + r.w, r.y],
                        [r.x, r.y + r.h],
                        [r.x + r.w, r.y + r.h]
                    ])
                    maxDist = Math.max(maxDist, Math.sqrt(cx * cx + cy * cy));
            return maxDist;
        }

        function svgArcPath(cx, cy, r, startAngle, endAngle, sweep) {
            const x1 = cx + r * Math.cos(startAngle);
            const y1 = cy + r * Math.sin(startAngle);
            const x2 = cx + r * Math.cos(endAngle);
            const y2 = cy + r * Math.sin(endAngle);
            const large = Math.abs(endAngle - startAngle) >= Math.PI ? 1 : 0;
            return `M ${x1} ${y1} A ${r} ${r} 0 ${large} ${sweep} ${x2} ${y2}`;
        }

        function shapeToSvgPath(s) {
            switch (s.type) {
                case 'circle': {
                    const R = s.radius ?? 1;
                    return `M ${-R} 0 A ${R} ${R} 0 1 1 ${R} 0 A ${R} ${R} 0 1 1 ${-R} 0 Z`;
                }
                case 'ellipse': {
                    const a = s.semiMajor ?? 1,
                        b = s.semiMinor ?? 1;
                    return `M ${-a} 0 A ${a} ${b} 0 1 1 ${a} 0 A ${a} ${b} 0 1 1 ${-a} 0 Z`;
                }
                case 'annulus': {
                    const ro = s.outerRadius ?? 2,
                        ri = s.innerRadius ?? 1;
                    return `M ${-ro} 0 A ${ro} ${ro} 0 1 1 ${ro} 0 A ${ro} ${ro} 0 1 1 ${-ro} 0 Z ` +
                        `M ${-ri} 0 A ${ri} ${ri} 0 1 0 ${ri} 0 A ${ri} ${ri} 0 1 0 ${-ri} 0 Z`;
                }
                case 'sector': {
                    const R = s.radius ?? 1;
                    const angle = s.centralAngle ?? 90;
                    const half = d2r(angle / 2);
                    const x1 = R * Math.sin(-half),
                        y1 = -R * Math.cos(-half);
                    const x2 = R * Math.sin(half),
                        y2 = -R * Math.cos(half);
                    const large = angle >= 180 ? 1 : 0;
                    return `M 0 0 L ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z`;
                }
                case 'segment': {
                    const R = s.radius ?? 1;
                    const angle = s.centralAngle ?? 90;
                    const half = d2r(angle / 2);
                    const x1 = -R * Math.sin(half),
                        y1 = -R * Math.cos(half);
                    const x2 = R * Math.sin(half),
                        y2 = -R * Math.cos(half);
                    const large = angle >= 180 ? 1 : 0;
                    return `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2} Z`;
                }
                case 'sector-annulus': {
                    const ro = s.outerRadius ?? 2,
                        ri = s.innerRadius ?? 1;
                    const angle = s.centralAngle ?? 90;
                    const half = d2r(angle / 2);
                    const ox1 = ro * Math.sin(-half),
                        oy1 = -ro * Math.cos(-half);
                    const ox2 = ro * Math.sin(half),
                        oy2 = -ro * Math.cos(half);
                    const ix1 = ri * Math.sin(half),
                        iy1 = -ri * Math.cos(half);
                    const ix2 = ri * Math.sin(-half),
                        iy2 = -ri * Math.cos(-half);
                    const large = angle >= 180 ? 1 : 0;
                    return `M ${ox1} ${oy1} A ${ro} ${ro} 0 ${large} 1 ${ox2} ${oy2} L ${ix1} ${iy1} A ${ri} ${ri} 0 ${large} 0 ${ix2} ${iy2} Z`;
                }
                case 'triangle': {
                    const verts = triangleVertices(s.sideA ?? 1, s.sideB ?? 1, s.sideC ?? 1);
                    if (!verts) return '';
                    return `M ${verts.map(v => v.join(' ')).join(' L ')} Z`;
                }
                case 'regular-polygon': {
                    const n = Math.max(3, Math.round(s.sides ?? 6));
                    const R = (s.sideLength ?? 1) / (2 * Math.sin(Math.PI / n));
                    const verts = regularPolygonVertices(n, R);
                    return `M ${verts.map(v => v.join(' ')).join(' L ')} Z`;
                }
                case 'trapezoid': {
                    const verts = trapezoidVertices(
                        s.topBase ?? 1, s.bottomBase ?? 2, s.height ?? 1,
                        s.leftAngle ?? 60, s.rightAngle ?? 60);
                    return `M ${verts.map(v => v.join(' ')).join(' L ')} Z`;
                }
                default: return '';
            }
        }

        // ============================================================
        //  形状参数配置
        // ============================================================
        const SHAPE_PARAMS_CONFIG = {
            circle: [{ id: 'radius', label: '半径 (mm)', def: 2000 }],
            ellipse: [{ id: 'semiMajor', label: '长轴半径', def: 2000 },
            { id: 'semiMinor', label: '短轴半径', def: 1000 }
            ],
            sector: [{ id: 'radius', label: '半径 (mm)', def: 2000 },
            { id: 'centralAngle', label: '圆心角 (°)', def: 90 }
            ],
            segment: [{ id: 'radius', label: '半径 (mm)', def: 2000 },
            { id: 'centralAngle', label: '圆心角 (°)', def: 90 }
            ],
            annulus: [{ id: 'outerRadius', label: '外半径 (mm)', def: 2000 },
            { id: 'innerRadius', label: '内半径 (mm)', def: 1000 }
            ],
            'sector-annulus': [{ id: 'outerRadius', label: '外半径 (mm)', def: 2000 },
            { id: 'innerRadius', label: '内半径 (mm)', def: 1000 },
            { id: 'centralAngle', label: '圆心角 (°)', def: 90 }
            ],
            triangle: [{ id: 'sideA', label: '边 a (mm)', def: 2000 },
            { id: 'sideB', label: '边 b (mm)', def: 3000 },
            { id: 'sideC', label: '边 c (mm)', def: 2000 }
            ],
            'regular-polygon': [{ id: 'sides', label: '边数', def: 6 },
            { id: 'sideLength', label: '边长 (mm)', def: 2000 }
            ],
            trapezoid: [{ id: 'topBase', label: '上底 (mm)', def: 2000 },
            { id: 'bottomBase', label: '下底 (mm)', def: 5000 },
            { id: 'height', label: '高 (mm)', def: 4000 },
            { id: 'leftAngle', label: '左底角 (°)', def: 90 },
            { id: 'rightAngle', label: '右底角 (°)', def: 70 }
            ],
        };

        function getShapeParamsLines(shape) {
            const config = SHAPE_PARAMS_CONFIG[shape.type] || [];
            const lines = [];
            for (const f of config) {
                const val = shape[f.id];
                if (val !== undefined) {
                    lines.push(`${f.label}: ${val}`);
                }
            }
            return lines;
        }

        // ============================================================
        //  全局状态
        // ============================================================
        let currentMode = 'contains';
        let lastResult = null;
        let lastShape = null;
        let lastW1 = 320,
            lastH1 = 160;

        const shapeTypeEl = document.getElementById('shape-type');
        const shapeParamsEl = document.getElementById('shape-params');
        const w1El = document.getElementById('w1');
        const h1El = document.getElementById('h1');
        const w2El = document.getElementById('w2');

        // ============================================================
        //  渲染参数表单
        // ============================================================
        function renderShapeParams() {
            const type = shapeTypeEl.value;
            const fields = SHAPE_PARAMS_CONFIG[type] || [];
            shapeParamsEl.innerHTML = '<div class="section-title">形状参数</div>';
            const useGrid = fields.length >= 2;
            if (useGrid) {
                const grid = document.createElement('div');
                grid.className = fields.length === 3 ? 'row3' : 'row2';
                fields.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'field';
                    div.innerHTML =
                        `<label>${f.label}</label><input type="number" id="sp-${f.id}" value="${f.def}" min="1" step="any">`;
                    grid.appendChild(div);
                });
                shapeParamsEl.appendChild(grid);
            } else {
                fields.forEach(f => {
                    const div = document.createElement('div');
                    div.className = 'field';
                    div.innerHTML =
                        `<label>${f.label}</label><input type="number" id="sp-${f.id}" value="${f.def}" min="1" step="any">`;
                    shapeParamsEl.appendChild(div);
                });
            }
        }

        function getShapeParams() {
            const type = shapeTypeEl.value;
            const fields = SHAPE_PARAMS_CONFIG[type] || [];
            const s = { type };
            for (const f of fields) {
                const el = document.getElementById(`sp-${f.id}`);
                if (el) s[f.id] = parseFloat(el.value) || f.def;

        // ============================================================
        //  验证
        // ============================================================
        function validate() {
            const type = shapeTypeEl.value;
            const sp = getShapeParams();
            const w1 = parseFloat(w1El.value),
                h1 = parseFloat(h1El.value);
            const w2str = w2El.value.trim(),
                h2str = h2El.value.trim();
            const hasSmall = w2str !== '' && h2str !== '';
            if (!w1 || w1 <= 0) return '大矩形宽 w1 必须大于 0';
            if (!h1 || h1 <= 0) return '大矩形高 h1 必须大于 0';
            if (type === 'triangle') {
                const { sideA: a, sideB: b, sideC: c } = sp;
                if (a + b <= c || a + c <= b || b + c <= a) return '三边长不满足三角形成立条件';
            }
            if (type === 'regular-polygon') {
                if ((sp.sides ?? 3) < 3) return '正多边形边数必须 ≥ 3';
            }
            if (type === 'annulus' || type === 'sector-annulus') {
                if ((sp.innerRadius ?? 0) >= (sp.outerRadius ?? 1)) return '内半径必须小于外半径';
            }
            if (type === 'trapezoid') {
                const la = sp.leftAngle ?? 0,
                    ra = sp.rightAngle ?? 0;
                if (la <= 0 || la >= 180 || ra <= 0 || ra >= 180) return '底角必须在 0°~180° 之间';
                if (la + ra >= 180) return '底角之和必须小于 180°';
            }
            if (hasSmall) {
                const w2 = parseFloat(w2str),
                    h2 = parseFloat(h2str);
                if (!w2 || w2 <= 0) return '小矩形宽 w2 必须大于 0';
                if (!h2 || h2 <= 0) return '小矩形高 h2 必须大于 0';
                const kw = w1 / w2,
                    kh = h1 / h2;
                if (Math.abs(kw - Math.round(kw)) > 1e-6) return 'w1 必须是 w2 的整数倍';
                if (Math.abs(kh - Math.round(kh)) > 1e-6) return 'h1 必须是 h2 的整数倍';
            }
            return null;
        }

        // ============================================================
        //  统计
        // ============================================================
        function computeStats(shape, result, w1, h1, mode) {
            const allRects = [...result.large, ...result.small];
            const largeCount = result.large.length;
            const smallCount = result.small.length;
            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            for (const r of allRects) {
                minX = Math.min(minX, r.x);
                maxX = Math.max(maxX, r.x + r.w);
                minY = Math.min(minY, r.y);
                maxY = Math.max(maxY, r.y + r.h);
            }
            const totalW = allRects.length ? maxX - minX : 0;
            const totalH = allRects.length ? maxY - minY : 0;
            const areaLarge = largeCount * w1 * h1;
            const areaSmall = result.small.length > 0 ? result.small.length * result.small[0].w * result.small[0].h : 0;
            const totalArea = (areaLarge + areaSmall) / 1e6;
            let cols = null,
                rows = null;
            if (allRects.length > 0) {
                const allW = allRects.map(r => r.w);
                const allH = allRects.map(r => r.h);
                const wEq = allW.every(v => Math.abs(v - allW[0]) < 0.5);
                const hEq = allH.every(v => Math.abs(v - allH[0]) < 0.5);
                if (wEq && allRects.length > 0) {
                    const xs = [...new Set(allRects.map(r => Math.round(r.x * 10) / 10))];
                    cols = xs.length;
                }
                if (hEq && allRects.length > 0) {
                    const ys = [...new Set(allRects.map(r => Math.round(r.y * 10) / 10))];
                    rows = ys.length;
                }
            }
            let gap = 0;
            if (allRects.length > 0) {
                if (mode === 'contains') {
                    const cornerCount = new Map();
                    for (const r of allRects) {
                        for (const [cx, cy] of [
                                [r.x, r.y],
                                [r.x + r.w, r.y],
                                [r.x, r.y + r.h],
                                [r.x + r.w, r.y + r.h]
                            ]) {
                            const key = `${cx.toFixed(3)},${cy.toFixed(3)}`;
                            cornerCount.set(key, (cornerCount.get(key) ?? 0) + 1);
                        }
                    }
                    let maxGap = 0;
                    for (const r of allRects) {
                        for (const [cx, cy] of [
                                [r.x, r.y],
                                [r.x + r.w, r.y],
                                [r.x, r.y + r.h],
                                [r.x + r.w, r.y + r.h]
                            ]) {
                            const key = `${cx.toFixed(3)},${cy.toFixed(3)}`;
                            if ((cornerCount.get(key) ?? 0) < 4) {
                                const d = distanceToShapeBoundary(cx, cy, shape);
                                if (d > maxGap) maxGap = d;
                            }
                        }
                    }
                    gap = maxGap;
                } else {
                    const ccR = computeCircumscribedRadius(allRects);
                    const charR = getShapeCharacteristicRadius(shape);
                    gap = Math.max(0, ccR - charR);
                }
            }
            return { largeCount, smallCount, totalW, totalH, totalArea, cols, rows, gap };
        }

        function renderStats(stats) {
            statsPanel.style.display = 'block';
            let html = '';
            if (stats.cols !== null)
                html +=
                `<div class="stat-row"><span class="stat-key">列数</span><span class="stat-val">${stats.cols}</span></div>`;
            if (stats.rows !== null)
                html +=
                `<div class="stat-row"><span class="stat-key">行数</span><span class="stat-val">${stats.rows}</span></div>`;
            html +=
                `<div class="stat-row"><span class="stat-key">包围盒</span><span class="stat-val yellow">${stats.totalW.toFixed(0)} × ${stats.totalH.toFixed(0)} mm</span></div>`;
            html += `<div class="stat-row"><span class="stat-key">大矩形数</span><span class="stat-val">${stats.largeCount}</span></div>`;
            if (stats.smallCount > 0) {
                html +=
                    `<div class="stat-row"><span class="stat-key">小矩形数</span><span class="stat-val cyan">${stats.smallCount}</span></div>`;
            }
            html += `<div class="stat-row"><span class="stat-key">总面积</span><span class="stat-val">${stats.totalArea.toFixed(4)} m²</span></div>`;
            statsContent.innerHTML = html;
        }

        // ============================================================
        //  主渲染（屏幕显示）
        // ============================================================
        function renderResult(shape, result, w1, h1, mode) {
            const allRects = [...result.large, ...result.small];
            if (allRects.length === 0 && mode === 'contains') {
                errorMsg.textContent = '矩形尺寸过大，无法在形状内填充任何矩形';
                emptyHint.style.display = 'flex';
                statsPanel.style.display = 'none';
                drawLayer.innerHTML = '';
                return;
            }
            emptyHint.style.display = 'none';
            const stats = computeStats(shape, result, w1, h1, mode);
            const canvasW = canvasWrap.clientWidth || 800;
            const canvasH = canvasWrap.clientHeight || 600;
            const b = getShapeBounds(shape);
            let viewMinX = b.minX,
                viewMinY = b.minY,
                viewMaxX = b.maxX,
                viewMaxY = b.maxY;
            for (const r of allRects) {
                viewMinX = Math.min(viewMinX, r.x);
                viewMaxX = Math.max(viewMaxX, r.x + r.w);
                viewMinY = Math.min(viewMinY, r.y);
                viewMaxY = Math.max(viewMaxY, r.y + r.h);
            }
            const pad = Math.max(viewMaxX - viewMinX, viewMaxY - viewMinY) * 0.08;
            viewMinX -= pad;
            viewMinY -= pad;
            viewMaxX += pad;
            viewMaxY += pad;
            const scale = Math.min(canvasW / (viewMaxX - viewMinX), canvasH / (viewMaxY - viewMinY));
            const tx = canvasW / 2 - (viewMinX + viewMaxX) / 2 * scale;
            const ty = canvasH / 2 - (viewMinY + viewMaxY) / 2 * scale;
            const ns = 'http://www.w3.org/2000/svg';
            drawLayer.innerHTML = '';
            drawLayer.setAttribute('transform', `translate(${tx}, ${ty}) scale(${scale})`);

            // 坐标轴
            const cross = document.createElementNS(ns, 'g');
            cross.setAttribute('opacity', '0.3');
            const cl = document.createElementNS(ns, 'line');
            cl.setAttribute('x1', String(-viewMaxX));
            cl.setAttribute('x2', String(viewMaxX));
            cl.setAttribute('y1', '0');
            cl.setAttribute('y2', '0');
            cl.setAttribute('stroke', '#38BDF8');
            cl.setAttribute('stroke-width', String(1 / scale));
            cl.setAttribute('stroke-dasharray', String(8 / scale) + ' ' + String(8 / scale));
            const cv = document.createElementNS(ns, 'line');
            cv.setAttribute('y1', String(-viewMaxY));
            cv.setAttribute('y2', String(viewMaxY));
            cv.setAttribute('x1', '0');
            cv.setAttribute('x2', '0');
            cv.setAttribute('stroke', '#38BDF8');
            cv.setAttribute('stroke-width', String(1 / scale));
            cv.setAttribute('stroke-dasharray', String(8 / scale) + ' ' + String(8 / scale));
            cross.appendChild(cl);
            cross.appendChild(cv);
            drawLayer.appendChild(cross);

            // 大矩形
            for (const r of result.large) {
                const el = document.createElementNS(ns, 'rect');
                el.setAttribute('x', r.x);
                el.setAttribute('y', r.y);
                el.setAttribute('width', r.w);
                el.setAttribute('height', r.h);
                el.setAttribute('fill', 'rgba(16,185,129,0.18)');
                el.setAttribute('stroke', '#10B981');
                el.setAttribute('stroke-width', String(1.5 / scale));
                drawLayer.appendChild(el);
            }
            // 小矩形
            for (const r of result.small) {
                const el = document.createElementNS(ns, 'rect');
                el.setAttribute('x', r.x);
                el.setAttribute('y', r.y);
                el.setAttribute('width', r.w);
                el.setAttribute('height', r.h);
                el.setAttribute('fill', 'rgba(56,189,248,0.14)');
                el.setAttribute('stroke', '#38BDF8');
                el.setAttribute('stroke-width', String(1.2 / scale));
                drawLayer.appendChild(el);
            }
            // 形状
            const pathD = shapeToSvgPath(shape);
            if (pathD) {
                const shEl = document.createElementNS(ns, 'path');
                shEl.setAttribute('d', pathD);
                shEl.setAttribute('fill', 'rgba(245,158,11,0.05)');
                shEl.setAttribute('stroke', '#FFFFFF');
                shEl.setAttribute('stroke-width', '2');
                shEl.setAttribute('vector-effect', 'non-scaling-stroke');
                shEl.setAttribute('fill-rule', 'evenodd');
                drawLayer.appendChild(shEl);
            }
            renderStats(stats);
        }

        // ============================================================
        //  buildExportSvg — 用于导出的 2K 分辨率 SVG 生成
        // ============================================================
        function buildExportSvg(targetWidth, targetHeight) {
            if (!lastResult || !lastShape) return null;
            const shape = lastShape;
            const result = lastResult;
            const w1 = lastW1;
            const h1 = lastH1;
            const mode = currentMode;
            const allRects = [...result.large, ...result.small];
            if (allRects.length === 0) return null;

            // 计算包围盒
            const b = getShapeBounds(shape);
            let viewMinX = b.minX,
                viewMinY = b.minY,
                viewMaxX = b.maxX,
                viewMaxY = b.maxY;
            for (const r of allRects) {
                viewMinX = Math.min(viewMinX, r.x);
                viewMaxX = Math.max(viewMaxX, r.x + r.w);
                viewMinY = Math.min(viewMinY, r.y);
                viewMaxY = Math.max(viewMaxY, r.y + r.h);
            }
            const pad = Math.max(viewMaxX - viewMinX, viewMaxY - viewMinY) * 0.08;
            viewMinX -= pad;
            viewMinY -= pad;
            viewMaxX += pad;
            viewMaxY += pad;

            const contentW = viewMaxX - viewMinX;
            const contentH = viewMaxY - viewMinY;
            const scaleX = targetWidth / contentW;
            const scaleY = targetHeight / contentH;
            const scale = Math.min(scaleX, scaleY);
            const tx = targetWidth / 2 - (viewMinX + viewMaxX) / 2 * scale;
            const ty = targetHeight / 2 - (viewMinY + viewMaxY) / 2 * scale;

            const sw = scale;

            // 构建 SVG
            let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${targetWidth}" height="${targetHeight}" viewBox="0 0 ${targetWidth} ${targetHeight}">
          <defs>
            <style>
              text { font-family: 'Fira Code','Roboto Mono','Courier New',monospace; }
            </style>
          </defs>
          <rect width="100%" height="100%" fill="#0f1a2b"/>
          <g transform="translate(${tx}, ${ty}) scale(${scale})">
            <!-- 坐标轴 -->
            <line x1="${-viewMaxX}" x2="${viewMaxX}" y1="0" y2="0" stroke="#38BDF8" stroke-width="${1/sw}" stroke-dasharray="${8/sw} ${8/sw}" opacity="0.3"/>
            <line y1="${-viewMaxY}" y2="${viewMaxY}" x1="0" x2="0" stroke="#38BDF8" stroke-width="${1/sw}" stroke-dasharray="${8/sw} ${8/sw}" opacity="0.3"/>
    `;

            // 大矩形
            for (const r of result.large) {
                svg +=
                    `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="rgba(16,185,129,0.18)" stroke="#10B981" stroke-width="${1.5/sw}"/>`;
            }
            // 小矩形
            for (const r of result.small) {
                svg +=
                    `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="rgba(56,189,248,0.14)" stroke="#38BDF8" stroke-width="${1.2/sw}"/>`;
            }
            // 形状
            const pathD = shapeToSvgPath(shape);
            if (pathD) {
                svg +=
                    `<path d="${pathD}" fill="rgba(245,158,11,0.05)" stroke="#FFFFFF" stroke-width="2" vector-effect="non-scaling-stroke" fill-rule="evenodd"/>`;
            }

            svg += `</g>`;

            // ---- 文字注释（右下角） ----
            const stats = computeStats(shape, result, w1, h1, mode);
            const paramLines = getShapeParamsLines(shape);
            const lines = [];
            for (const line of paramLines) lines.push(line);
            lines.push('--------------------');
            if (stats.cols !== null) lines.push(`列数: ${stats.cols}`);
            if (stats.rows !== null) lines.push(`行数: ${stats.rows}`);
            lines.push(`包围盒: ${stats.totalW.toFixed(0)} × ${stats.totalH.toFixed(0)} mm`);
            lines.push(`大矩形数: ${stats.largeCount}`);
            if (stats.smallCount > 0) lines.push(`小矩形数: ${stats.smallCount}`);
            lines.push(`总面积: ${stats.totalArea.toFixed(4)} m²`);
            const allowance = parseFloat(document.getElementById('allowance')?.value) || 0;
            if (mode === 'surround' && allowance > 0) {
                const allRectsNow = [...result.large, ...result.small];
                const noAllowRects = solveRectsSurroundShape(shape, w1, h1, 0);
                if (noAllowRects.length > allRectsNow.length) {
                    lines.push(`实际边沿留空: ${allowance} mm (过滤 ${noAllowRects.length - allRectsNow.length} 个矩形)`);
                }
            }

            const fontSize = 14;
            const lineHeight = fontSize * 1.5;
            const margin = 22;
            let xPos = targetWidth - margin;
            let yPos = targetHeight - margin;
            // 从下往上排
            for (let i = lines.length - 1; i >= 0; i--) {
                const txt = lines[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                svg +=
                    `<text x="${xPos}" y="${yPos}" text-anchor="end" font-size="${fontSize}" fill="#FFFFFF" font-family="'Fira Code','Roboto Mono','Courier New',monospace">${txt}</text>`;
                yPos -= lineHeight;
            }

            svg += `</svg>`;
            return svg;
        }

        // ============================================================
        //  生成按钮
        // ============================================================
        btnGenerate.addEventListener('click', async () => {
            const err = validate();
            if (err) { errorMsg.textContent = err; return; }
            errorMsg.textContent = '';
            const shape = getShapeParams();
            const w1 = parseFloat(w1El.value);
            const h1 = parseFloat(h1El.value);
            const w2str = w2El.value.trim(),
                h2str = h2El.value.trim();
            const hasSmall = w2str !== '' && h2str !== '';
            const w2 = hasSmall ? parseFloat(w2str) : 0;
            const h2 = hasSmall ? parseFloat(h2str) : 0;
            let allowance = 0;
            if (currentMode === 'surround') {
                const allowanceEl = document.getElementById('allowance');
                allowance = parseFloat(allowanceEl.value) || 0;
                if (allowance < 0) {
                    errorMsg.textContent = '允许留空不能为负数';
                    return;
                }
            }

            loading.classList.add('show');
            loadingText.textContent = 'COMPUTING...';
            btnGenerate.disabled = true;
            await new Promise(r => setTimeout(r, 30));

            let result;
            try {
                if (hasSmall) {
                    if (currentMode === 'contains') {
                        const r = solveMixedShapeContains(shape, w1, h1, w2, h2);
                        result = { large: r.large, small: r.small };
                    } else {
                        const r = solveMixedRectsSurroundShape(shape, w1, h1, w2, h2, allowance);
                        result = { large: r.large, small: r.small };
                    }
                } else {
                    if (currentMode === 'contains') {
                        const rects = solveShapeContainsRects(shape, w1, h1);
                        result = { large: rects, small: [] };
                    } else {
                        const rects = solveRectsSurroundShape(shape, w1, h1, allowance);
                        result = { large: rects, small: [] };
                    }
                }
            } catch (e) {
                loading.classList.remove('show');
                btnGenerate.disabled = false;
                errorMsg.textContent = '计算出错：' + e.message;
                return;
            }

            lastResult = result;
            lastShape = shape;
            lastW1 = w1;
            lastH1 = h1;
            renderResult(shape, result, w1, h1, currentMode);

            loading.classList.remove('show');
            btnGenerate.disabled = false;
            expJpg.disabled = false;
            expPdf.disabled = false;

            const SHAPE_NAMES = {
                circle: '圆',
                trapezoid: '梯形',
                triangle: '三角形',
                ellipse: '椭圆',
                sector: '扇形',
                segment: '弓形',
                annulus: '圆环',
                'sector-annulus': '扇环',
                'regular-polygon': '正多边形'
            };
            sbShape.textContent = SHAPE_NAMES[shape.type] || shape.type;
            sbMode.textContent = currentMode === 'contains' ? '形状包围矩形' : '矩形包围形状';
            if (result.small.length > 0) {
                sbCount.textContent = `${result.large.length}大 + ${result.small.length}小`;
            } else {
                sbCount.textContent = `${result.large.length}大`;
            }
        });

        // ============================================================
        //  导出 JPG / PDF（2K）
        // ============================================================
        function generateFileName(shape, w1, h1, smallW, smallH, totalW, totalH) {
            const shapeNames = {
                circle: '圆',
                trapezoid: '梯形',
                triangle: '三角形',
                ellipse: '椭圆',
                sector: '扇形',
                segment: '弓形',
                annulus: '圆环',
                'sector-annulus': '扇环',
                'regular-polygon': '正多边形'
            };
            const type = shape.type;
            const name = shapeNames[type] || type;
            const config = SHAPE_PARAMS_CONFIG[type] || [];
            const paramValues = config.map(f => {
                const val = shape[f.id];
                return val !== undefined ? Math.round(val) : '';
            }).filter(v => v !== '');
            const paramStr = paramValues.join('x');
            const shapePart = `${name}(${paramStr})`;
            const bigRect = `${Math.round(w1)}x${Math.round(h1)}`;
            const smallPart = (smallW > 0 && smallH > 0) ? `(${Math.round(smallW)}x${Math.round(smallH)})` : '';
            const bbox = `${Math.round(totalW)}x${Math.round(totalH)}`;
            const now = new Date();
            const dateStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0');
            return `${shapePart}-${bigRect}${smallPart}-${bbox}-${dateStr}`;
        }

        expJpg.addEventListener('click', () => {
            if (!lastResult || !lastShape) {
                alert('请先生成填充方案');
                return;
            }
            const stats = computeStats(lastShape, lastResult, lastW1, lastH1, currentMode);
            const { totalW, totalH, smallCount } = stats;
            const smallW = (smallCount > 0) ? lastResult.small[0].w : 0;
            const smallH = (smallCount > 0) ? lastResult.small[0].h : 0;
            const fileName = generateFileName(lastShape, lastW1, lastH1, smallW, smallH, totalW, totalH);

            // 2K 分辨率
            const TARGET_W = 2560;
            const TARGET_H = 1440;
            const svgStr = buildExportSvg(TARGET_W, TARGET_H);
            if (!svgStr) { alert('无法生成导出内容'); return; }

            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = TARGET_W;
                c.height = TARGET_H;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#0f1a2b';
                ctx.fillRect(0, 0, TARGET_W, TARGET_H);
                ctx.drawImage(img, 0, 0, TARGET_W, TARGET_H);
                URL.revokeObjectURL(url);
                const link = document.createElement('a');
                link.href = c.toDataURL('image/jpeg', 0.95);
                link.download = fileName + '.jpg';
                link.click();
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                alert('导出 JPG 失败，请重试');
            };
            img.src = url;
        });

        expPdf.addEventListener('click', () => {
            if (!lastResult || !lastShape) {
                alert('请先生成填充方案');
                return;
            }
            const stats = computeStats(lastShape, lastResult, lastW1, lastH1, currentMode);
            const { totalW, totalH, smallCount } = stats;
            const smallW = (smallCount > 0) ? lastResult.small[0].w : 0;
            const smallH = (smallCount > 0) ? lastResult.small[0].h : 0;
            const fileName = generateFileName(lastShape, lastW1, lastH1, smallW, smallH, totalW, totalH);

            const TARGET_W = 2560;
            const TARGET_H = 1440;
            const svgStr = buildExportSvg(TARGET_W, TARGET_H);
            if (!svgStr) { alert('无法生成导出内容'); return; }

            const blob = new Blob([svgStr], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = TARGET_W;
                c.height = TARGET_H;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#0f1a2b';
                ctx.fillRect(0, 0, TARGET_W, TARGET_H);
                ctx.drawImage(img, 0, 0, TARGET_W, TARGET_H);
                URL.revokeObjectURL(url);
                const imgData = c.toDataURL('image/jpeg', 0.92);
                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: TARGET_W > TARGET_H ? 'landscape' : 'portrait', unit: 'px',
                        format: [TARGET_W, TARGET_H] });
                    pdf.addImage(imgData, 'JPEG', 0, 0, TARGET_W, TARGET_H);
                    pdf.save(fileName + '.pdf');
                } catch (e) {
                    alert('PDF 导出失败：' + e.message);
                }
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                alert('导出 PDF 失败，请重试');
            };
            img.src = url;
        });

        // ============================================================
        //  窗口尺寸变化重绘
        // ============================================================
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (lastResult && lastShape) {
                    renderResult(lastShape, lastResult, lastW1, lastH1, currentMode);
                }
            }, 150);
        });

        // ============================================================
        //  初始化
        // ============================================================
        (function init() {
            const update = () => {
                const w = canvasWrap.clientWidth,
                    h = canvasWrap.clientHeight;
                mainSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);
                chV.setAttribute('y1', 0);
                chV.setAttribute('y2', h);
                chH.setAttribute('x1', 0);
                chH.setAttribute('x2', w);
            };
            update();
            window.addEventListener('resize', update);
        })();
    </script>
</body>
