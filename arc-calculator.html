<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弧形计算器 · 专业版</title>
    <style>
        :root {
            --theme-1: #0f172a;
            --theme-2: #1e293b;
            --theme-3: #38bdf8;
            --theme-4: #7dd3fc;
            --theme-5: rgba(2, 132, 199, 0.3);
            --theme-6: rgba(94, 234, 212, 0.2);
            --theme-7: rgba(56, 189, 248, 0.5);
            --theme-8: rgba(56, 189, 248, 0.3);
            --radius: 16px;
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, var(--theme-1), var(--theme-2));
            color: var(--theme-4);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 20px;
            transition: background 0.4s, color 0.3s;
        }

        /* ===== 主容器 ===== */
        .box {
            width: 100%;
            max-width: 880px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--theme-6);
            padding: 24px 28px 28px;
            transition: border-color 0.3s, background 0.3s;
        }

        /* ===== 标题 ===== */
        .header-area {
            text-align: center;
            margin-bottom: 18px;
        }
        .header-area h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--theme-3);
            text-shadow: 0 0 20px var(--theme-7);
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }
        .header-area .sub {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* ===== 左右布局 ===== */
        .main-layout {
            display: flex;
            gap: 28px;
            align-items: stretch;
        }

        /* ===== 左侧画布 ===== */
        .left-panel {
            flex: 0 0 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }
        .left-panel canvas {
            width: 100%;
            max-width: 420px;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.5);
            border: 1px solid var(--theme-6);
            box-shadow: 0 4px 30px rgba(2, 132, 199, 0.15);
            display: block;
            transition: border-color 0.3s;
        }

        /* ===== 右侧面板 ===== */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        /* 单选行 */
        .radio-row {
            display: flex;
            justify-content: center;
            gap: 28px;
            font-size: 15px;
            padding: 4px 0 6px;
            flex-wrap: wrap;
        }
        .radio-row label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: var(--theme-4);
            font-weight: 500;
            transition: color 0.2s;
        }
        .radio-row label:hover {
            color: #fff;
        }
        .radio-row input[type="radio"] {
            accent-color: var(--theme-3);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 输入行 */
        .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .row label {
            width: 90px;
            flex-shrink: 0;
            font-weight: 600;
            color: #f0f9ff;
            font-size: 15px;
            letter-spacing: 0.3px;
            transition: color 0.3s;
        }
        .row input[type="number"] {
            flex: 1;
            padding: 9px 12px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid var(--theme-6);
            border-radius: 10px;
            color: #f0f9ff;
            font-size: 15px;
            transition: all var(--transition);
            min-width: 0;
            width: 0;
            outline: none;
        }
        .row input[type="number"]:focus {
            border-color: var(--theme-3);
            box-shadow: 0 0 0 3px var(--theme-8);
            background: rgba(2, 6, 23, 0.8);
        }
        .row input[type="number"]::placeholder {
            color: #475569;
            font-size: 14px;
        }
        /* 去掉 spinner */
        .row input[type="number"]::-webkit-inner-spin-button,
        .row input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .row input[type="number"] {
            -moz-appearance: textfield;
            appearance: textfield;
        }

        /* 提示 */
        .hint-box {
            background: rgba(56, 189, 248, 0.06);
            border-left: 3px solid var(--theme-3);
            border-radius: 6px;
            padding: 8px 14px;
            margin: 4px 0 2px;
        }
        .hint-box p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.5;
            margin: 0;
        }
        .hint-box p strong {
            color: var(--theme-4);
        }

        /* 定弦长结果 */
        .fixed-chord-result {
            background: rgba(34, 197, 94, 0.08);
            border-left: 3px solid #22c55e;
            border-radius: 6px;
            padding: 8px 14px;
            margin: 2px 0;
            display: none;
        }
        .fixed-chord-result p {
            font-size: 13px;
            color: #86efac;
            line-height: 1.6;
            margin: 0;
        }
        .fixed-chord-result p strong {
            color: #4ade80;
        }

        /* 按钮行 */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn-row button {
            flex: 1;
            padding: 11px 14px;
            background: linear-gradient(135deg, var(--theme-3), #06b6d4);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 4px 20px rgba(8, 145, 178, 0.35);
            letter-spacing: 0.5px;
        }
        .btn-row button:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 30px rgba(8, 145, 178, 0.5);
        }
        .btn-row button:active {
            transform: scale(0.97);
        }
        .btn-row button.btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            box-shadow: none;
            border: 1px solid var(--theme-6);
        }
        .btn-row button.btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        /* 错误信息 */
        .error {
            color: #f87171;
            font-size: 15px;
            margin-top: 6px;
            text-align: center;
            min-height: 1.6em;
            font-weight: 500;
            background: rgba(248, 113, 113, 0.08);
            border-radius: 6px;
            padding: 4px 8px;
            transition: all 0.3s;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .main-layout {
                flex-wrap: wrap;
                gap: 18px;
            }
            .left-panel {
                flex: 1 1 100%;
                max-width: 100%;
            }
            .left-panel canvas {
                max-width: 100%;
            }
            .right-panel {
                flex: 1 1 100%;
            }
            .box {
                padding: 16px;
            }
            .row label {
                width: 66px;
                font-size: 14px;
            }
            .row input[type="number"] {
                font-size: 15px;
                padding: 7px 10px;
            }
            .header-area h2 {
                font-size: 1.5rem;
            }
            .radio-row {
                gap: 16px;
                font-size: 14px;
            }
        }

        @media (max-width: 440px) {
            body {
                padding: 10px;
                padding-top: 10px;
            }
            .box {
                padding: 12px;
            }
            .row label {
                width: 56px;
                font-size: 13px;
            }
            .row input[type="number"] {
                font-size: 14px;
                padding: 6px 8px;
            }
            .btn-row button {
                font-size: 14px;
                padding: 8px 10px;
            }
            .header-area h2 {
                font-size: 1.25rem;
            }
            .hint-box p {
                font-size: 12px;
            }
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--theme-3);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- ===== 主容器 ===== -->
    <div class="box">

        <!-- 标题 -->
        <div class="header-area">
            <h2>📐 弧形计算器 <span style="font-size: .5em; font-weight: bold;">V1.11.0</span> </h2>
            <div class="sub">已知任意 2 个量 · 自动求解全参数</div>
        </div>

        <!-- 左右布局 -->
        <div class="main-layout">

            <!-- 左侧画布 -->
            <div class="left-panel">
                <canvas id="cv" width="420" height="420"></canvas>
            </div>

            <!-- 右侧控件 -->
            <div class="right-panel">

                <!-- 劣弧 / 优弧 -->
                <div class="radio-row">
                    <label><input type="radio" name="arc" value="minor" checked disabled /> 劣弧 (θ ≤ 180°)</label>
                    <label><input type="radio" name="arc" value="major" disabled /> 优弧 (θ &gt; 180°)</label>
                </div>

                <!-- 输入 -->
                <div class="row"><label>弧长 s</label><input id="s" type="number" step="any" min="0" placeholder="mm" /></div>
                <div class="row"><label>半径 r</label><input id="r" type="number" step="any" min="0" placeholder="mm" /></div>
                <div class="row"><label>弦长 c</label><input id="c" type="number" step="any" min="0" placeholder="mm" /></div>
                <div class="row"><label>弦高 h</label><input id="h" type="number" step="any" min="0" placeholder="mm" /></div>
                <div class="row"><label>圆心角 θ</label><input id="theta" type="number" step="any" min="0" placeholder="度" /></div>

                <!-- 提示 -->
                <div class="hint-box">
                    <p>💡 任意填写 <strong>2 个</strong> 非空值 · 双解时切换优/劣弧 · 所有值 ≥ 0</p>
                </div>

                <!-- 定弦长 L -->
                <div class="row"><label>定弦长 L</label><input id="L" type="number" step="any" min="0" placeholder="mm（可选，不影响弧形计算）" /></div>

                <!-- 定弦长结果 -->
                <div class="fixed-chord-result" id="fixedChordResult"></div>

                <!-- 按钮 -->
                <div class="btn-row">
                    <button onclick="calc()">⚡ 计算</button>
                    <button class="btn-secondary" onclick="resetAll()">✕ 清空</button>
                </div>

                <!-- 错误 -->
                <div id="err" class="error"></div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    JavaScript 业务逻辑
    ============================================================ -->
    <script>
        const DEG = Math.PI / 180;
        const IDS = ['s', 'r', 'c', 'h', 'theta'];
        let lastResult = null;

        /** 安全获取输入值，返回对象 { s, r, c, h, thetaRad } */
        function getInputs() {
            const val = {};
            let count = 0;
            for (const id of IDS) {
                const el = document.getElementById(id);
                const v = parseFloat(el.value);
                if (!isNaN(v) && v >= 0) {
                    val[id] = v;
                    count++;
                }
            }
            if (count < 2) throw new Error('请至少填写 2 个已知量');
            if (val.theta !== undefined) val.thetaRad = val.theta * DEG;
            return val;
        }

        /** 核心求解器，返回 { s, r, c, h, theta, major? } */
        function solve() {
            const v = getInputs();
            let res = {};

            function makeResult(s, r, c, h, thetaDeg) {
                return { s, r, c, h, theta: thetaDeg };
            }

            const has = (k) => k in v;

            // 1) s + r
            if (has('s') && has('r')) {
                const theta = v.s / v.r;
                if (v.s > 2 * Math.PI * v.r) throw new Error('弧长不能超过周长');
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                res = makeResult(v.s, v.r, 2 * v.r * Math.sin(theta / 2), v.r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 2) s + theta
            else if (has('s') && has('thetaRad')) {
                const theta = v.thetaRad;
                const r = v.s / theta;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                if (v.s > 2 * Math.PI * r) throw new Error('弧长不能超过周长');
                res = makeResult(v.s, r, 2 * r * Math.sin(theta / 2), r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 3) s + c
            else if (has('s') && has('c')) {
                const { s, c } = v;
                function f(t) { return Math.sin(t / 2) - (c / s) * (t / 2); }
                function df(t) { return 0.5 * Math.cos(t / 2) - (c / s) * 0.5; }
                let t = 1.0;
                for (let i = 0; i < 60; i++) {
                    const ft = f(t);
                    if (Math.abs(ft) < 1e-14) break;
                    t -= ft / df(t);
                    if (t < 0) t = 0.5;
                }
                const theta = t;
                const r = s / theta;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                if (s > 2 * Math.PI * r) throw new Error('弧长不能超过周长');
                if (c > 2 * r) throw new Error('弦长不能大于直径');
                res = makeResult(s, r, c, r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 4) s + h
            else if (has('s') && has('h')) {
                const { s, h } = v;
                function f(t) { return 1 - Math.cos(t / 2) - (t * h) / s; }
                function df(t) { return 0.5 * Math.sin(t / 2) - h / s; }
                let t = 1.0;
                for (let i = 0; i < 60; i++) {
                    const ft = f(t);
                    if (Math.abs(ft) < 1e-14) break;
                    t -= ft / df(t);
                    if (t < 0) t = 0.5;
                }
                const theta = t;
                const r = s / theta;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                if (s > 2 * Math.PI * r) throw new Error('弧长不能超过周长');
                if (h > r) throw new Error('弦高不能大于半径');
                res = makeResult(s, r, 2 * r * Math.sin(theta / 2), h, theta / DEG);
            }
            // 5) r + theta
            else if (has('r') && has('thetaRad')) {
                const theta = v.thetaRad;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                res = makeResult(v.r * theta, v.r, 2 * v.r * Math.sin(theta / 2), v.r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 6) r + c
            else if (has('r') && has('c')) {
                const theta = 2 * Math.asin(Math.min(v.c / (2 * v.r), 1));
                if (v.c > 2 * v.r) throw new Error('弦长不能大于直径');
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                res = makeResult(v.r * theta, v.r, v.c, v.r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 7) r + h
            else if (has('r') && has('h')) {
                if (v.h >= v.r) throw new Error('弦高不能大于等于半径');
                const theta = 2 * Math.acos(1 - v.h / v.r);
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                res = makeResult(v.r * theta, v.r, 2 * v.r * Math.sin(theta / 2), v.h, theta / DEG);
                const thetaM = 2 * Math.PI - theta;
                if (thetaM > 0 && thetaM < 2 * Math.PI) {
                    res.major = makeResult(v.r * thetaM, v.r, 2 * v.r * Math.sin(thetaM / 2), v.r * (1 - Math.cos(thetaM / 2)), thetaM / DEG);
                }
            }
            // 8) c + h
            else if (has('c') && has('h')) {
                const r = (v.c * v.c / 4 + v.h * v.h) / (2 * v.h);
                if (v.h >= r) throw new Error('弦高不能大于等于半径');
                if (v.c > 2 * r) throw new Error('弦长不能大于直径');
                const theta = 2 * Math.asin(Math.min(v.c / (2 * r), 1));
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                res = makeResult(r * theta, r, v.c, v.h, theta / DEG);
                const thetaM = 2 * Math.PI - theta;
                if (thetaM > 0 && thetaM < 2 * Math.PI) {
                    res.major = makeResult(r * thetaM, r, v.c, r * (1 - Math.cos(thetaM / 2)), thetaM / DEG);
                }
            }
            // 9) c + theta
            else if (has('c') && has('thetaRad')) {
                const theta = v.thetaRad;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                const r = v.c / (2 * Math.sin(theta / 2));
                if (v.c > 2 * r) throw new Error('弦长不能大于直径');
                res = makeResult(r * theta, r, v.c, r * (1 - Math.cos(theta / 2)), theta / DEG);
            }
            // 10) h + theta
            else if (has('h') && has('thetaRad')) {
                const theta = v.thetaRad;
                if (theta > 2 * Math.PI) throw new Error('圆心角不能超过360°');
                const r = v.h / (1 - Math.cos(theta / 2));
                if (v.h > r) throw new Error('弦高不能大于半径');
                res = makeResult(r * theta, r, 2 * r * Math.sin(theta / 2), v.h, theta / DEG);
            } else {
                throw new Error('不支持的参数组合');
            }

            // 合法性检查
            for (const k of ['s', 'r', 'c', 'h', 'theta']) {
                if (res[k] === undefined || !isFinite(res[k]) || res[k] < 0) {
                    throw new Error(`计算结果异常: ${k} = ${res[k]}`);
                }
            }
            if (res.s > 2 * Math.PI * res.r + 1e-9) throw new Error('弧长超过周长');
            if (res.c > 2 * res.r + 1e-9) throw new Error('弦长超过直径');
            if (res.h > res.r + 1e-9) throw new Error('弦高超过半径');
            if (res.theta > 360 + 1e-9) throw new Error('圆心角超过360°');

            return res;
        }

        /* ============================================================
                   定弦长计算
                   ============================================================ */
        function calcFixedChord(out) {
            const LEl = document.getElementById('L');
            const resultEl = document.getElementById('fixedChordResult');
            const L = parseFloat(LEl.value);

            resultEl.style.display = 'none';
            resultEl.innerHTML = '';

            if (isNaN(L) || L <= 0) return;

            const r = out.r;
            const thetaDeg = out.theta; // 弧长对应的圆心角（度）
            const thetaRad = thetaDeg * DEG;

            // 定弦长 L 对应的圆心角
            const deltaRad = 2 * Math.asin(Math.min(L / (2 * r), 1));
            const deltaDeg = deltaRad / DEG;

            // 弧长 s 对应的圆心角内能容纳多少段定弦长
            const n = Math.floor(thetaRad / deltaRad);

            if (n < 1) {
                resultEl.innerHTML = `<p>⚠ 定弦长 L = ${L.toFixed(4)} 大于该弧的弦长，无法容纳</p>`;
                resultEl.style.display = 'block';
                return;
            }

            // 相邻定弦长之间的夹角 = deltaDeg
            const segArc = r * deltaRad; // 每段定弦长对应的弧长
            const remainRad = thetaRad - n * deltaRad;
            const remainArc = r * remainRad;

            let html = `<p><strong>定弦长段数：</strong>${n} 段</p>`;
            html += `<p><strong>每段定弦长：</strong>L = ${L.toFixed(4)} mm</p>`;
            html += `<p><strong>相邻定弦长夹角：</strong>δ = ${deltaDeg.toFixed(4)}°</p>`;
            html += `<p><strong>每段对应弧长：</strong>${segArc.toFixed(4)} mm</p>`;
            if (remainRad > 1e-9) {
                html += `<p><strong>剩余弧长：</strong>${remainArc.toFixed(4)} mm（夹角 ${(remainRad / DEG).toFixed(4)}°）</p>`;
            } else {
                html += `<p><strong>恰好整除，无剩余弧长</strong></p>`;
            }
            resultEl.innerHTML = html;
            resultEl.style.display = 'block';
        }

        /* ============================================================
                   绘图
                   ============================================================ */
        function draw(res) {
            const cv = document.getElementById('cv');
            const ctx = cv.getContext('2d');
            const W = cv.width, H = cv.height;
            const cx = W / 2, cy = H / 2;

            const margin = 50;
            const maxDim = Math.min(W, H) - margin;
            const scale = maxDim / (2 * (res.r || 1) + 0.01);
            const rPix = (res.r || 1) * scale;

            ctx.clearRect(0, 0, W, H);

            const toX = (mm) => cx + mm * scale;
            const toY = (mm) => cy - mm * scale;

            // ---- 背景极简网格 ----
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 0.5;
            for (let i = -10; i <= 10; i++) {
                if (i === 0) continue;
                const p = i * (res.r / 4);
                ctx.beginPath();
                ctx.moveTo(toX(p), 0);
                ctx.lineTo(toX(p), H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, toY(p));
                ctx.lineTo(W, toY(p));
                ctx.stroke();
            }
            ctx.restore();

            // ---- 整圆 ----
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, rPix, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // ---- 扇形填充 ----
            const thetaRad = (res.theta || 0) * DEG;
            const startAngle = -thetaRad / 2;
            const endAngle = thetaRad / 2;

            const fillColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-3').trim() || '#38bdf8';

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, rPix, startAngle, endAngle, false);
            ctx.closePath();
            ctx.fillStyle = fillColor + '25';
            ctx.fill();
            ctx.strokeStyle = fillColor + '80';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();

            // ---- 弧线 (高亮) ----
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, rPix, startAngle, endAngle, false);
            ctx.strokeStyle = fillColor;
            ctx.lineWidth = 3.5;
            ctx.shadowColor = fillColor + '60';
            ctx.shadowBlur = 12;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();

            // ---- 半径线 ----
            const x1 = res.r * Math.cos(startAngle), y1 = res.r * Math.sin(startAngle);
            const x2 = res.r * Math.cos(endAngle), y2 = res.r * Math.sin(endAngle);

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(toX(x1), toY(y1));
            ctx.moveTo(cx, cy);
            ctx.lineTo(toX(x2), toY(y2));
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2;
            ctx.setLineDash([3, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // ---- 弦 ----
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(toX(x1), toY(y1));
            ctx.lineTo(toX(x2), toY(y2));
            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#f472b640';
            ctx.shadowBlur = 8;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();

            // ---- 弦高标注 (虚线) ----
            const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
            const hEndX = 0, hEndY = res.r * Math.cos(thetaRad / 2);
            ctx.save();
            ctx.setLineDash([3, 4]);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(toX(midX), toY(midY));
            ctx.lineTo(toX(hEndX), toY(hEndY));
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // ---- 定弦长分段标注（弦线 + 分点） ----
            const L = parseFloat(document.getElementById('L').value);
            if (!isNaN(L) && L > 0) {
                const deltaRad = 2 * Math.asin(Math.min(L / (2 * res.r), 1));
                const n = Math.floor(thetaRad / deltaRad);
                if (n >= 1) {
                    // 收集所有分点角度（含起点）
                    const angles = [startAngle];
                    for (let i = 1; i <= n; i++) {
                        const angle = startAngle + i * deltaRad;
                        if (angle > endAngle + 1e-9) break;
                        angles.push(angle);
                    }

                    // 画定弦长的弦线
                    ctx.save();
                    ctx.strokeStyle = '#4ade80';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.shadowColor = '#4ade8060';
                    ctx.shadowBlur = 6;
                    for (let i = 0; i < angles.length - 1; i++) {
                        const px1 = res.r * Math.cos(angles[i]);
                        const py1 = res.r * Math.sin(angles[i]);
                        const px2 = res.r * Math.cos(angles[i + 1]);
                        const py2 = res.r * Math.sin(angles[i + 1]);
                        ctx.beginPath();
                        ctx.moveTo(toX(px1), toY(py1));
                        ctx.lineTo(toX(px2), toY(py2));
                        ctx.stroke();
                    }
                    // 如果恰好到终点，补画最后一段
                    if (angles[angles.length - 1] < endAngle - 1e-9) {
                        const px1 = res.r * Math.cos(angles[angles.length - 1]);
                        const py1 = res.r * Math.sin(angles[angles.length - 1]);
                        const px2 = res.r * Math.cos(endAngle);
                        const py2 = res.r * Math.sin(endAngle);
                        ctx.beginPath();
                        ctx.moveTo(toX(px1), toY(py1));
                        ctx.lineTo(toX(px2), toY(py2));
                        ctx.stroke();
                    }
                    ctx.setLineDash([]);
                    ctx.shadowBlur = 0;
                    ctx.restore();

                    // 画分点圆点
                    for (const angle of angles) {
                        const px = res.r * Math.cos(angle);
                        const py = res.r * Math.sin(angle);
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(toX(px), toY(py), 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#4ade80';
                        ctx.shadowColor = '#4ade8080';
                        ctx.shadowBlur = 8;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                }
            }

            // ---- 端点圆点 ----
            const dotColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-4').trim() || '#7dd3fc';
            for (const [px, py] of [[x1, y1], [x2, y2]]) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(toX(px), toY(py), 5, 0, 2 * Math.PI);
                ctx.fillStyle = dotColor;
                ctx.shadowColor = dotColor + '80';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
            // 圆心
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf2480';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            // ---- 文字信息 ----
            const txtColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-4').trim() || '#7dd3fc';
            ctx.save();
            ctx.fillStyle = txtColor;
            ctx.font = '13px "Segoe UI", system-ui, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 6;
            const lines = [
                `r = ${(res.r || 0).toFixed(2)}`,
                `θ = ${(res.theta || 0).toFixed(2)}°`,
                `s = ${(res.s || 0).toFixed(2)}`,
                `c = ${(res.c || 0).toFixed(2)}`,
                `h = ${(res.h || 0).toFixed(2)}`
            ];
            lines.forEach((text, i) => {
                ctx.fillText(text, 14, 24 + i * 20);
            });
            ctx.shadowBlur = 0;
            ctx.restore();

            // ---- 图例 ----
            ctx.save();
            const legendY = H - 28;
            ctx.font = '12px "Segoe UI", system-ui, sans-serif';
            ctx.fillStyle = fillColor;
            ctx.fillText('● 弧', 12, legendY);
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('━ 半径', 72, legendY);
            ctx.fillStyle = '#f472b6';
            ctx.fillText('━ 弦', 142, legendY);
            // 定弦长图例
            const LVal = parseFloat(document.getElementById('L').value);
            if (!isNaN(LVal) && LVal > 0) {
                ctx.fillStyle = '#4ade80';
                ctx.fillText('● 定弦长分段', 212, legendY);
            }
            ctx.restore();
        }

        /* ============================================================
                   对外接口
                   ============================================================ */
        function calc() {
            const errEl = document.getElementById('err');
            errEl.textContent = '';
            let res;
            try {
                res = solve();
            } catch (e) {
                errEl.textContent = '⚠ ' + e.message;
                resetAll();
                return;
            }
            lastResult = res;

            const hasMajor = !!res.major;
            const radios = document.querySelectorAll('input[name=arc]');
            radios.forEach(el => el.disabled = !hasMajor);
            if (!hasMajor) {
                document.querySelector('input[name=arc][value="minor"]').checked = true;
            }

            const useMajor = hasMajor && document.querySelector('input[name=arc]:checked').value === 'major';
            const out = useMajor ? res.major : res;

            // 回填
            IDS.forEach(id => {
                const el = document.getElementById(id);
                if (out[id] !== undefined) {
                    el.value = Math.max(0, out[id]).toFixed(4);
                }
            });

            draw(out);

            // 定弦长计算
            calcFixedChord(out);
        }

        // 劣/优 切换重新计算
        document.querySelectorAll('input[name=arc]').forEach(el => {
            el.addEventListener('change', () => { if (lastResult) calc(); });
        });

        // 回车触发
        document.querySelectorAll('.row input').forEach(el => {
            el.addEventListener('keydown', (e) => { if (e.key === 'Enter') calc(); });
        });

        function resetAll() {
            IDS.forEach(id => document.getElementById(id).value = '');
            document.getElementById('L').value = '';
            document.getElementById('err').textContent = '';
            document.getElementById('fixedChordResult').style.display = 'none';
            document.getElementById('fixedChordResult').innerHTML = '';
            const ctx = document.getElementById('cv').getContext('2d');
            ctx.clearRect(0, 0, 420, 420);
            document.querySelectorAll('input[name=arc]').forEach(el => {
                el.disabled = true;
                el.checked = el.value === 'minor';
            });
            lastResult = null;
            // 显示提示文字
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '16px "Segoe UI", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('请填写参数后点击计算', 210, 210);
            ctx.restore();
        }

        // ===== 初始化 =====
        resetAll();
    </script>
</body>
</html>
