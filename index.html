<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页工具，前端设计，LED显示屏设计</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/index.css">
</head>

<body>
    <!-- ===== 左侧菜单 ===== -->
    <div class="sidebar">
        <div class="logo-container">
            <div class="logo">笙</div>
            <div>
                <div class="logo-text">网页工具</div>
                <div class="version">V1.2.1</div>
            </div>
        </div>
        <!-- 菜单由 JS 动态渲染 -->
        <div class="nav-menu" id="navMenu"></div>
        <div class="sidebar-footer">© 2026 网页工具 • 保留所有权利<br>E-mail：zgswork@foxmail.com</div>
    </div>
    <!-- ===== 右侧主区域 ===== -->
    <div class="main-content">
        <div class="header">
            <div>
                <div class="page-title" id="current-page-title">首页概览</div>
                <div class="page-subtitle" id="current-page-subtitle">欢迎使用网页工具</div>
            </div>
            <!-- -->
            <div class="user-info">
                <div class="user-avatar">
                    <!--<i class="fas fa-user">笙</i>-->
                    笙
                </div>
                <div>
                    <div style="font-weight:600;">笙</div>
                    <div style="font-size:0.8rem;color:var(--text-muted);">s</div>
                </div>
            </div>
        </div>
        <div class="iframe-wrapper">
            <iframe id="pageFrame" src="welcome.html"></iframe>
        </div>
    </div>
    <script src="/js/index_data.js"></script>
    <script>        
        // ===================== DOM 引用 =====================
        const navMenu = document.getElementById('navMenu');
        const frame = document.getElementById('pageFrame');
        const titleEl = document.getElementById('current-page-title');
        const subtitleEl = document.getElementById('current-page-subtitle');
        // ===================== 构建菜单 =====================
        function buildMenu() {
            navMenu.innerHTML = navItems.map(item => `
                <a href="#" class="nav-item" data-id="${item.id}">
                    <span class="nav-icon"><i class="fas ${item.icon}"></i></span>
                    <span class="nav-text">${item.title}</span>
                </a>
            `).join('');
        }
        buildMenu();
        // ===================== 切换页面 =====================
        function switchPage(pageId) {
            const item = navItems.find(i => i.id === pageId);
            if (!item) return;
            // 更新菜单激活状态
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === pageId);
            });
            // 更新标题
            titleEl.textContent = item.title;
            subtitleEl.textContent = item.subtitle;
            // 更新 iframe
            frame.src = item.page;
            // 保存当前页面
            localStorage.setItem('currentPage', pageId);
        }
        // ===================== 绑定点击事件 =====================
        navMenu.addEventListener('click', function (e) {
            const link = e.target.closest('.nav-item');
            if (link) {
                e.preventDefault();
                const pageId = link.dataset.id;
                if (pageId) switchPage(pageId);
            }
        });
        // ===================== 恢复上次访问 =====================
        const saved = localStorage.getItem('currentPage') || 'welcome';
        // 确保保存的页面仍存在于数据中
        const exists = navItems.some(i => i.id === saved);
        switchPage(exists ? saved : 'welcome');
        // 暴露切换函数给子页面使用
        window.switchPage = switchPage;
    </script>
    
</body>

</html>
